<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Generador de vídeos verticales 1080×1920 para TikTok / Reels / Shorts.
   Todo se dibuja con formas y texto propios: sin imágenes, clips ni música de terceros (cero riesgo de copyright).
   Zona segura de TikTok respetada: nada importante por encima de y=180, por debajo de y=1500 ni a la derecha de x=950. */
const W = 1080, H = 1920, C = document.getElementById('c'), X = C.getContext('2d');
const ACC = '#FF5500', BG = '#07070A', PANEL = '#101118', PANEL2 = '#161822', LINE = 'rgba(255,255,255,.12)', MUT = '#a1a1aa', OK = '#34D399', GOLD = '#FBBF24';
const MONO = '"DejaVu Sans Mono", monospace';

const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const P = (t, a, b) => cl((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eb = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function font(size, w = 800, fam = 'Inter') { X.font = `${w} ${size}px ${fam}`; }
function txt(s, x, y, o = {}) {
  X.save(); X.globalAlpha *= (o.a ?? 1); font(o.size || 60, o.w || 800, o.fam || 'Inter');
  X.fillStyle = o.c || '#fff'; X.textAlign = o.align || 'center'; X.textBaseline = 'alphabetic'; X.fillText(s, x, y); X.restore();
}
function wrap(s, maxW, size, w = 800) {
  font(size, w); const out = []; let l = '';
  s.split(' ').forEach((wd) => { const t = l ? l + ' ' + wd : wd; if (X.measureText(t).width > maxW && l) { out.push(l); l = wd; } else l = t; });
  if (l) out.push(l); return out;
}
function rr(x, y, w, h, r, fill, stroke, lw = 3) {
  X.beginPath(); X.roundRect(x, y, w, h, r);
  if (fill) { X.fillStyle = fill; X.fill(); }
  if (stroke) { X.lineWidth = lw; X.strokeStyle = stroke; X.stroke(); }
}
// Línea con palabras de distinto color, centrada y con escala (para los ganchos)
function rich(segs, cx, y, size, alpha = 1, scale = 1) {
  font(size, 900); const w = segs.reduce((s, [t]) => s + X.measureText(t).width, 0);
  X.save(); X.globalAlpha *= alpha; X.translate(cx, y); X.scale(scale, scale); X.textAlign = 'left'; X.textBaseline = 'alphabetic';
  let x = -w / 2; segs.forEach(([t, c]) => { X.fillStyle = c || '#fff'; X.fillText(t, x, 0); x += X.measureText(t).width; });
  X.restore();
}
function blob(x, y, r, c) { const g = X.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = g; X.fillRect(0, 0, W, H); }
function bg(t) {
  X.fillStyle = BG; X.fillRect(0, 0, W, H);
  blob(220 + 140 * Math.sin(t * 0.4), 360 + 90 * Math.cos(t * 0.3), 950, 'rgba(255,85,0,.22)');
  blob(880 + 110 * Math.cos(t * 0.35), 1450 + 130 * Math.sin(t * 0.25), 900, 'rgba(124,58,237,.17)');
}
function radar(cx, cy, r, t) {
  X.save(); X.translate(cx, cy);
  rr(-r * 1.25, -r * 1.25, r * 2.5, r * 2.5, r * 0.5, '#12141E', 'rgba(255,85,0,.45)', r * 0.04);
  const g = X.createConicGradient(t * 2.4, 0, 0);
  g.addColorStop(0, 'rgba(255,85,0,.55)'); g.addColorStop(0.28, 'rgba(255,85,0,0)'); g.addColorStop(1, 'rgba(255,85,0,0)');
  X.fillStyle = g; X.beginPath(); X.arc(0, 0, r * 0.98, 0, 7); X.fill();
  X.strokeStyle = 'rgba(255,85,0,.6)'; X.lineWidth = r * 0.07; X.beginPath(); X.arc(0, 0, r * 0.9, 0, 7); X.stroke();
  X.strokeStyle = 'rgba(255,255,255,.3)'; X.lineWidth = r * 0.04; X.setLineDash([r * 0.14, r * 0.14]); X.beginPath(); X.arc(0, 0, r * 0.55, 0, 7); X.stroke(); X.setLineDash([]);
  X.fillStyle = ACC; X.beginPath(); X.arc(0, 0, r * 0.15, 0, 7); X.fill();
  X.fillStyle = '#fff'; X.beginPath(); X.arc(0, 0, r * 0.06, 0, 7); X.fill();
  X.fillStyle = OK; X.beginPath(); X.arc(r * 0.42, -r * 0.48, r * 0.1, 0, 7); X.fill();
  X.restore();
}
function wordmark(cx, y, size, a = 1) { rich([['Ani', '#fff'], ['Radar', ACC]], cx, y, size, a); }
// Marca fija arriba (dentro de la zona segura)
function brandTop(t) { radar(430, 214, 26, t); txt('aniradar.net', 470, 228, { size: 40, w: 800, align: 'left', c: '#e4e4e7' }); }
function check(x, y, s, c = OK, lw) {
  X.save(); X.strokeStyle = c; X.lineWidth = lw || s * 0.18; X.lineCap = 'round'; X.lineJoin = 'round';
  X.beginPath(); X.moveTo(x - s * 0.42, y); X.lineTo(x - s * 0.12, y + s * 0.3); X.lineTo(x + s * 0.45, y - s * 0.32); X.stroke(); X.restore();
}
function tap(x, y, lt, at) { // pulsación: círculo que se encoge y onda que se expande
  const p = P(lt, at - 0.25, at + 0.45); if (p <= 0 || p >= 1) return;
  X.save(); X.globalAlpha = 1 - p;
  X.fillStyle = 'rgba(255,255,255,.85)'; X.beginPath(); X.arc(x, y, 34 * (1 - p * 0.4), 0, 7); X.fill();
  X.strokeStyle = 'rgba(255,255,255,.9)'; X.lineWidth = 6; X.beginPath(); X.arc(x, y, 40 + p * 70, 0, 7); X.stroke();
  X.restore();
}
// Póster «genérico» (degradado + forma abstracta): nunca carátulas reales
function fakePoster(x, y, w, h, hue, t = 0) {
  const g = X.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, `hsl(${hue} 70% 45%)`); g.addColorStop(1, `hsl(${(hue + 50) % 360} 70% 18%)`);
  rr(x, y, w, h, Math.min(w, h) * 0.1, g);
  X.save(); X.beginPath(); X.roundRect(x, y, w, h, Math.min(w, h) * 0.1); X.clip();
  X.fillStyle = 'rgba(255,255,255,.14)'; X.beginPath(); X.arc(x + w * 0.7, y + h * 0.3, w * 0.28, 0, 7); X.fill();
  X.fillStyle = 'rgba(0,0,0,.28)'; X.beginPath(); X.moveTo(x, y + h); X.lineTo(x, y + h * 0.65); X.quadraticCurveTo(x + w * 0.4, y + h * 0.45, x + w, y + h * 0.7); X.lineTo(x + w, y + h); X.fill();
  X.restore();
}
function chip(x, y, label, o = {}) {
  font(o.size || 38, 700); const w = X.measureText(label).width + (o.pad || 30) * 2, h = o.h || 84;
  rr(x, y, w, h, h * 0.32, o.on ? 'rgba(255,85,0,.25)' : PANEL2, o.on ? ACC : LINE, o.on ? 4 : 2);
  txt(label, x + w / 2, y + h / 2 + (o.size || 38) * 0.36, { size: o.size || 38, w: 700, c: o.on ? '#fff' : '#e4e4e7' });
  return w;
}
function flow(labels, x0, y0, maxW, o = {}) { // coloca chips en filas; devuelve posiciones
  font(o.size || 38, 700); const gap = 16, h = o.h || 84, pos = []; let x = x0, y = y0;
  labels.forEach((l) => { const w = X.measureText(l).width + (o.pad || 30) * 2; if (x + w > x0 + maxW) { x = x0; y += h + gap; } pos.push({ l, x, y, w, h }); x += w + gap; });
  return pos;
}
function cta(lt, url, sub) {
  radar(540, 720, 120, lt + 3);
  const s = eb(P(lt, 0.1, 0.6));
  rich([['Ani', '#fff'], ['Radar', ACC]], 540, 1010, 140, P(lt, 0.1, 0.4), s);
  font(52, 800); const w = X.measureText(url).width + 90;
  X.save(); X.globalAlpha *= P(lt, 0.5, 0.9);
  rr(540 - w / 2, 1080, w, 110, 55, ACC); txt(url, 540, 1153, { size: 52, w: 800 });
  X.restore();
  txt(sub, 540, 1290, { size: 40, w: 600, c: MUT, a: P(lt, 0.8, 1.2) });
}
function hook(lt, lines, size, y0, sub) {
  lines.forEach((segs, i) => { const p = P(lt, 0.05 + i * 0.22, 0.45 + i * 0.22); rich(segs, 540, y0 + i * size * 1.12, size, p, 0.7 + 0.3 * eb(p)); });
  if (sub) txt(sub[0], 540, y0 + lines.length * size * 1.12 + 70, { size: 46, w: 700, c: sub[1] || MUT, a: P(lt, sub[2] || 1.4, (sub[2] || 1.4) + 0.4) });
}
function scene(t, a, b, fn, last) {
  if (t < a || t >= b) return;
  const lt = t - a, d = b - a, ai = eo(P(lt, 0, 0.35)), ao = last ? 1 : 1 - P(lt, d - 0.3, d);
  X.save(); X.globalAlpha = Math.min(ai, ao); X.translate(0, (1 - ai) * 60 - (1 - ao) * 40); fn(lt, d); X.restore();
}

/* ================= VÍDEO 3 · «¿A qué hora sale el próximo episodio?» ================= */
function bell(cx, cy, s, a) {
  X.save(); X.translate(cx, cy - s * 0.6); X.rotate(a); X.translate(0, s * 0.6);
  X.fillStyle = ACC; X.beginPath(); X.moveTo(-s * 0.55, s * 0.35); X.quadraticCurveTo(-s * 0.5, -s * 0.55, 0, -s * 0.6); X.quadraticCurveTo(s * 0.5, -s * 0.55, s * 0.55, s * 0.35); X.lineTo(s * 0.7, s * 0.5); X.lineTo(-s * 0.7, s * 0.5); X.closePath(); X.fill();
  X.beginPath(); X.arc(0, s * 0.65, s * 0.16, 0, 7); X.fill(); X.beginPath(); X.arc(0, -s * 0.66, s * 0.1, 0, 7); X.fill();
  X.restore();
}
